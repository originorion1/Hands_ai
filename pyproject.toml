[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orion-core"
version = "0.1.0"
description = "ORION — generic learning and governed automation kernel"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = ["cryptography>=43.0", "orion-connector-sdk==0.1.0"]

[project.scripts]
orion-runtime = "orion.pilot.deployment:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "hatchling>=1.27", "jsonschema>=4.0"]

[tool.uv.sources]
orion-connector-sdk = { path = "packages/connector-sdk" }

[tool.hatch.build.targets.wheel]
packages = ["src/orion", "src/orion_http"]
exclude = [
    "src/orion/discovery/erpnext_*.py",
    "src/orion/discovery/retained_investigation_session.py",
    "src/orion/pilot/erpnext_candidate.py",
    "src/orion/presentation/report_interface.py",
    "src/orion_http/report_server.py",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "packages/**",
    "src/orion/discovery/erpnext_*.py",
    "src/orion/discovery/retained_investigation_session.py",
    "src/orion/pilot/erpnext_candidate.py",
    "src/orion/presentation/report_interface.py",
    "src/orion_http/report_server.py",
]

[tool.pytest.ini_options]
pythonpath = ["src", "packages/connector-sdk/src", "packages/erpnext-discovery/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
