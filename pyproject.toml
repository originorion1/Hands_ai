[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orion-core"
version = "0.1.0"
description = "ORION — generic learning and governed automation kernel"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = ["cryptography>=43.0"]

[project.scripts]
orion-runtime = "orion.pilot.deployment:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "hatchling>=1.27", "jsonschema>=4.0"]
erpnext-discovery = ["orion-connector-erpnext-discovery==0.1.0"]

[tool.uv.sources]
orion-connector-erpnext-discovery = { path = "packages/erpnext-discovery" }

[tool.hatch.build.targets.wheel]
packages = ["src/orion", "src/orion_http"]
exclude = ["src/orion/discovery/erpnext_adapter.py"]

[tool.hatch.build.targets.sdist]
exclude = ["src/orion/discovery/erpnext_adapter.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
