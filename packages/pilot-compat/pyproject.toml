[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "originorion-erpnext-pilot-compat"
version = "0.2.0rc4"
description = "Historical ERPNext supervised pilot and demo compatibility for ORION"
requires-python = ">=3.12"
dependencies = [
    "originorion-core==0.2.0rc2",
    "originorion-connector-erpnext-discovery==0.2.0rc4",
    "originorion-connector-sdk==0.2.0rc1",
]

[project.scripts]
orion-runtime = "orion.pilot.deployment:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/orion/pilot", "src/orion/demo.py"]
sources = ["src"]
