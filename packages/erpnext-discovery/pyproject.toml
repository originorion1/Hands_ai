[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orion-connector-erpnext-discovery"
version = "0.1.0"
description = "ERPNext discovery adapter for the ORION Kernel"
requires-python = ">=3.12"
dependencies = ["orion-core==0.1.0"]

[tool.hatch.build.targets.wheel]
only-include = []

[tool.hatch.build.targets.wheel.force-include]
"../../src/orion/discovery/erpnext_adapter.py" = "orion/discovery/erpnext_adapter.py"
