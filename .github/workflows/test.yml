name: ORION tests

on:
  push:
    branches: [main, 'laboratory/**']
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate commit to qualify
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Record exact runner and source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          python --version
          git rev-parse HEAD HEAD^{tree}
      - name: Install project
        run: |
          python -m pip install -e packages/connector-sdk
          python -m pip install -e '.[dev]'
          python -m pip install -e packages/erpnext-discovery
          python -m pip install -e packages/pilot-compat
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -vv -ra --junitxml=pytest-full.xml 2>&1 | tee pytest-full.log
      - name: Preserve complete test log and JUnit result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orion-full-pytest-${{ github.run_id }}
          path: |
            pytest-full.log
            pytest-full.xml
          if-no-files-found: warn
