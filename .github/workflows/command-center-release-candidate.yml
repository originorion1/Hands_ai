name: Command Center release candidate checks

on:
  pull_request:
    paths:
      - "api/**"
      - "deployment/**"
      - "src/orion/presentation/**"
      - "src/orion_http/**"
      - "src/orion/stores/private_files.py"
      - "src/orion/discovery/erpnext_live_session.py"
      - "tests/test_authenticated_report_server.py"
      - "tests/test_vercel_report_boundary.py"
      - "tests/test_vercel_stage_a.py"
      - "tests/system/**"
      - "tests/ui/test-command-center.js"
      - "vercel.json"
      - ".github/workflows/command-center-release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-api-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install focused test tools
        run: |
          python -m pip install -e packages/connector-sdk
          python -m pip install -e ".[dev]"
          python -m pip install -e packages/erpnext-discovery
          python -m pip install -e packages/pilot-compat
      - name: Python syntax and deployment configuration
        run: |
          python -m compileall -q api deployment src/orion/presentation src/orion_http
          python -m json.tool vercel.json > /dev/null
      - name: Ruff application and test sources
        run: python -m ruff check src/orion src/orion_http deployment api tests
      - name: Focused HTTP boundary tests
        run: python -m pytest -q tests/test_authenticated_report_server.py tests/test_vercel_report_boundary.py tests/test_vercel_stage_a.py
      - name: Build reviewed UI
        run: python deployment/vercel/build_static.py
      - name: DOM behavior regression
        run: node tests/ui/test-command-center.js
